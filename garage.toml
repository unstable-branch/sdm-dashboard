metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3902"
rpc_public_addr = "garage:3902"
# ⚠️  DEV ONLY: Garage reads rpc_secret from this file in dev. In production,
#     pass --rpc-secret via env (GARAGE_RPC_SECRET) or override the file with
#     `openssl rand -hex 32`. Leave this value as-is only for local dev.

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[s3_web]
bind_addr = "[::]:3901"
root_domain = ".web.garage.localhost"
index = "index.html"

[admin]
api_bind_addr = "[::]:3903"
# ⚠️  DEV ONLY: Garage reads admin/metrics tokens from this file in dev. In
#     production, pass --admin-token / --metrics-token via env (GARAGE_ADMIN_TOKEN,
#     GARAGE_METRICS_TOKEN). Leave these values as-is only for local dev.
